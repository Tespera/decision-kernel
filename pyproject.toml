[project]
name = "decision-kernel"
version = "0.1.0"
description = "Teach Claude Code how you make decisions — distil a personal decision kernel from your own session history. 从你的 Claude Code 对话记录里蒸馏个人决策内核。"
readme = "README.md"
authors = [
    { name = "Eliauk", email = "tespera@foxmail.com" }
]
requires-python = ">=3.13"
dependencies = []

license = "MIT"
keywords = ["claude-code", "claude", "anthropic", "ai-coding", "llm", "prompt-engineering", "decision-making", "preferences", "agent-memory", "vibe-coding"]

[project.urls]
Homepage = "https://github.com/Tespera/decision-kernel"
Issues = "https://github.com/Tespera/decision-kernel/issues"

[project.scripts]
dk = "decision_kernel:main"
decision-kernel = "decision_kernel:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
